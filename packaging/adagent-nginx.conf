# Rate limiting zone — applied to /analyze to prevent abuse
limit_req_zone $binary_remote_addr zone=adagent_analyze:10m rate=6r/m;

# 1. Protection against bad bots and vulnerability scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*(netcrawler|sqlmap|nikto|dirbuster|censys|shodan|python-requests|wget|curl) 1;
    ~*(scan|bot|crawler|spider) 1;
}

# 2. Protection against mapping bypass via Query string (fixing your vulnerability)
# If a bot tries to pass something suspicious in ?error= or other parameters — block it.
map $args $suspicious_args {
    default 0;
    ~*(phpinfo|env|git|config|setup|payload|select|union|concat|\.env) 1;
}

# 3. Allowlist — STRICTLY according to your FastAPI application code
map "$request_method:$uri" $is_allowed_adagent_api {
    default 0;

    # Main and utility endpoints
    "GET:/"                         1; # Landing page
    "GET:/health"                   1; # Healthcheck
    "POST:/analyze"                 1; # Analysis form submission
    "POST:/webhooks/stripe"         1; # Payment system webhooks

    # Authorization (Auth)
    "GET:/auth"                     1; # Login page
    "POST:/auth"                    1; # Email submission for Magic Link
    "POST:/auth/logout"             1; # Account logout

    # Personal account and subscriptions
    "GET:/history"                  1; # Report history
    "GET:/subscribe"                1; # Plan selection page
    "POST:/subscribe/checkout"      1; # Stripe Checkout session creation
    "GET:/subscribe/success"        1; # Successful payment page

    # Dynamic endpoints (validation by tokens and report IDs)
    # Allows GET:/auth/verify/any_token
    "~^GET:/auth/verify/[^/]+$"     1;

    # Allows GET:/report/ and GET:/api/report/... only if followed by an ID (string without slashes)
    "~^GET:/report/[^/]+$"          1;
    "~^GET:/api/report/[^/]+/status$" 1;

    # Static files (allowing only what FastAPI serves)
    "~^GET:/static/.*\.(html|css|js|jpe?g|png|gif|ico|svg)$" 1;
}

# 4. Drop connections if accessed directly via IP (HTTP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name catchall.adagent;
    return 444;
}

# Legitimate redirect to HTTPS for your domain
server {
    listen 80;
    server_name adagent.dimosense.com;
    return 301 https://$host$request_uri;
}

# 5. Drop connections if accessed directly via IP (HTTPS)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name catchall.adagent;

    ssl_certificate     /etc/letsencrypt/live/adagent.dimosense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adagent.dimosense.com/privkey.pem;

    return 444;
}

# Main secure server
server {
    listen 443 ssl;
    http2  on;
    server_name adagent.dimosense.com;

    ssl_certificate     /etc/letsencrypt/live/adagent.dimosense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adagent.dimosense.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /var/log/adagent/nginx_access.log;
    error_log   /var/log/adagent/nginx_error.log;

    client_max_body_size 1m;

    # Bot filtering
    if ($bad_bot = 1) {
        return 444;
    }

    # Malicious Query parameter filtering
    if ($suspicious_args = 1) {
        return 444;
    }

    # Strict allowlist endpoint check
    # If the request is not in the map — return 403 Forbidden (hides the app structure from scanners)
    if ($is_allowed_adagent_api = 0) {
        return 403;
    }

    # Stripe webhook — no limits, increased body size (if needed)
    location /webhooks/stripe {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Analysis generation endpoint — protected by Rate Limiting
    location /analyze {
        limit_req zone=adagent_analyze burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # All other valid endpoints (passed the allowlist check)
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # Keep the timeout for long-running calculations
    }
}
