# Rate limiting zone — applied to /analyze to prevent abuse
limit_req_zone $binary_remote_addr zone=adagent_analyze:10m rate=6r/m;

# Allow only specific API endpoints; deny all others. This is a defense-in-depth
map "$request_method:$uri" $is_allowed_adagent_api {
    default 0;
    # Public
    "POST:/analyze" 1;
    "POST:/webhooks/stripe" 1;
    "GET:/" 1; # adagent.dimosense.com
    "GET:/health" 1;
    "GET:/auth" 1;
    "POST:/auth" 1;
    "POST:/auth/logout" 1;
    "GET:/history" 1;
    "GET:/subscribe" 1;
    "POST:/subscribe/checkout" 1;
    "GET:/subscribe/success" 1;

    # Dynamic endpoints
    "~^GET:/report/[^/]+$" 1;
    "~^GET:/api/report/[^/]+/status$" 1;
    "~^GET:/auth/verify/[^/]+$" 1;

    # Static files
    "~^GET:/static/.*\.(html|css|js|jpe?g|png|gif|ico|svg)$" 1;
}

server {
    listen 80;
    server_name adagent.dimosense.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2  on;
    server_name adagent.dimosense.com;

    ssl_certificate     /etc/letsencrypt/live/adagent.dimosense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adagent.dimosense.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /var/log/adagent/nginx_access.log;
    error_log   /var/log/adagent/nginx_error.log;

    client_max_body_size 1m;

    if ($is_allowed_adagent_api = 0) {
        return 405;
    }

    # Stripe webhook — higher body size, no rate limit
    location /webhooks/stripe {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Analysis endpoint — rate limited (6 requests/minute per IP)
    location /analyze {
        limit_req zone=adagent_analyze burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # analysis can take a few minutes
    }
}
