{% extends "base.html" %}
{% block title %}Error — AdAgent{% endblock %}
{% block content %}
<div class="container" style="max-width:520px;padding-top:60px;text-align:center">
  <div class="card">
    <div style="font-size:2.5rem;margin-bottom:12px">⚠️</div>
    <h1 style="color:var(--navy);margin-bottom:12px">Analysis failed</h1>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:24px">
      {{ message | default('Something went wrong during the analysis.') }}
    </p>
    <a href="/" class="btn btn-primary">Try again →</a>
  </div>
</div>
{% endblock %}
