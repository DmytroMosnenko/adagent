name: Build RPM

on:
  push:
    tags:
      - 'v*'

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      # Build inside Almalinux for best RPM compatibility with Hetzner
      image: almalinux:10

    steps:
      - name: Install RPM build tools
        run: |
          dnf -y update
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf -y install \
            rpm-build rpmdevtools systemd-rpm-macros rpmlint \
            tar gzip findutils sed git python3 rsync

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Stamp version into config.py
        run: |
          sed -i "s/APP_VERSION: str = \".*\"/APP_VERSION: str = \"${{ steps.version.outputs.VERSION }}\"/" \
            service/config.py

      - name: Prepare RPM build tree
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -r . ~/rpmbuild/SOURCES/
          cp packaging/adagent.spec ~/rpmbuild/SPECS/adagent.spec

      - name: Build RPM
        run: |
          rpmbuild -bb \
            --define "_topdir     $HOME/rpmbuild" \
            --define "_sourcedir  $HOME/rpmbuild/SOURCES" \
            --define "version     ${{ steps.version.outputs.VERSION }}" \
            ~/rpmbuild/SPECS/adagent.spec

      - name: Lint RPM (non-blocking)
        run: rpmlint ~/rpmbuild/RPMS/x86_64/adagent-*.rpm || true

      - name: Upload RPM as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ~/rpmbuild/RPMS/x86_64/adagent-*.rpm
          generate_release_notes: true
